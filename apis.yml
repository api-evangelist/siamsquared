name: SiamSquared
description: >-
  SiamSquared Technologies (Thailand) Co., Ltd. is the Bangkok-based company behind StockRadars
  (stockradars.co), a retail stock-investment analysis platform branded "investing made simple."
  StockRadars offers mobile apps (iOS and Android, including a paid StockRadars PLUS tier) and a
  web app for the Thai stock market, with features such as customizable screening "radars,"
  Top100 rankings, income-statement views, shareholder tracking, volume analysis, real-time price
  alerts, and an in-house news feed (stockradars.news). The company is a 500 Global portfolio
  company. As of this enrichment pass StockRadars publishes no public API, developer portal, SDKs,
  or API documentation — it is a consumer-facing application, so most machine-readable API
  artifacts are not applicable and this profile captures identity plus a domain-security probe.
